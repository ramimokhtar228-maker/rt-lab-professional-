<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RT LIS — نظام إدارة المعمل (Supabase)</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --ink:#13262b; --paper:#f6f8f7; --line:#c9d6d2;
  --teal:#0c5c53; --teal-d:#083f39; --amber:#b5691a; --red:#a3312a; --card:#ffffff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#e8f1ee; --paper:#0f1a1a; --line:#284341; --teal:#5fc4b4; --teal-d:#8fe0d2; --card:#152423; }
}
:root[data-theme="dark"]{ --ink:#e8f1ee; --paper:#0f1a1a; --line:#284341; --teal:#5fc4b4; --teal-d:#8fe0d2; --card:#152423; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:"Segoe UI",Tahoma,Arial,sans-serif; font-size:15px; line-height:1.5}
header{position:sticky; top:0; padding-top:env(safe-area-inset-top,0px); background:var(--teal-d); color:#fff; padding:14px 18px; z-index:5; display:flex; justify-content:space-between; align-items:center}
header h1{margin:0; font-size:18px}
header p{margin:2px 0 0; font-size:12px; opacity:.85}
#logoutBtn{background:transparent; border:1px solid #fff6; color:#fff; padding:6px 10px; border-radius:6px; font-size:12px; cursor:pointer}
nav{display:flex; gap:6px; overflow-x:auto; padding:8px 12px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:56px; z-index:4}
nav button{border:1px solid var(--line); background:transparent; color:var(--ink); padding:7px 12px; border-radius:6px; font-size:13px; cursor:pointer; white-space:nowrap}
nav button.active{background:var(--teal); color:#fff; border-color:var(--teal)}
main{max-width:760px; margin:0 auto; padding:16px 14px 60px}
h2{font-size:16px; margin:4px 0 12px; border-right:3px solid var(--teal); padding-right:8px}
.card{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:14px}
label{display:block; font-size:12px; margin:8px 0 3px; opacity:.85}
input,select,textarea{width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:5px; background:var(--paper); color:var(--ink); font-size:14px; font-family:inherit}
.row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
.btn{margin-top:12px; background:var(--teal); color:#fff; border:none; padding:9px 16px; border-radius:6px; font-size:14px; cursor:pointer}
.btn.secondary{background:transparent; color:var(--teal); border:1px solid var(--teal)}
.btn.small{padding:5px 10px; font-size:12px; margin-top:0}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{text-align:right; padding:7px 6px; border-bottom:1px solid var(--line)}
th{opacity:.7; font-weight:600; font-size:12px}
.tag{display:inline-block; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:600}
.tag.pending{background:#f0e2c0; color:var(--amber)}
.tag.done{background:#cfe8de; color:var(--teal-d)}
.empty{opacity:.6; font-size:13px; padding:14px 0; text-align:center}
.wrap{overflow-x:auto}
.result-line{display:grid; grid-template-columns:1.4fr .8fr .8fr 1fr; gap:8px; margin-bottom:6px}
@media (max-width:480px){.result-line{grid-template-columns:1fr 1fr}}
.muted{font-size:12px; opacity:.65; margin-top:2px}
#authScreen{max-width:360px; margin:60px auto; padding:0 14px}
#configWarn{background:#f3d3d0; color:var(--red); padding:10px; border-radius:6px; font-size:13px; margin:12px 14px}
</style>
</head>
<body>
<header>
  <div><h1>RT — نظام إدارة المعمل</h1><p>نسخة مشتركة (Supabase)</p></div>
  <button id="logoutBtn" style="display:none">خروج</button>
</header>
<div id="configWarn" style="display:none"></div>
<div id="authScreen" style="display:none">
  <div class="card">
    <h2>تسجيل الدخول</h2>
    <label>اسم المستخدم</label><input id="au_email" type="text" placeholder="مثال: ahmed">
    <label>كلمة المرور</label><input id="au_pass" type="password">
    <button class="btn" id="signInBtn">دخول</button>
    <button class="btn secondary" id="signUpBtn" type="button">إنشاء حساب جديد لموظف</button>
    <p class="muted" id="authMsg"></p>
  </div>
</div>
<nav id="nav" style="display:none"></nav>
<main id="main"></main>

<script>
// ====== عدّل السطرين دول بعد ما تنشئ مشروعك على Supabase (Settings -> API) ======
const SUPABASE_URL = "https://xmaqyqdravjmstybxcep.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtYXF5cWRyYXZqbXN0eWJ4Y2VwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNTEyMjksImV4cCI6MjEwNTgyNzIyOX0.Xg4NYI4xeLsK896da63ELrvgBSEUl_gxIwtfeJyRjUo";
// ================================================================================

let sb = null;
const configured = !SUPABASE_URL.includes("PASTE_") && !SUPABASE_ANON_KEY.includes("PASTE_");
if(configured){ sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
else {
  document.getElementById("configWarn").style.display = "block";
  document.getElementById("configWarn").textContent = "لسه محتاج تحط رابط ومفتاح مشروع Supabase بتاعك في أول ملف الكود (السطرين SUPABASE_URL و SUPABASE_ANON_KEY).";
}

const TABS = [
  {id:"orders", label:"الاستقبال والطلب"},
  {id:"specimens", label:"العينات"},
  {id:"results", label:"النتائج"},
  {id:"worklist", label:"قائمة العمل والتقارير"},
];
let active = "orders";
let cache = { orders: [], specimens: [], results: [] };

function fmt(t){ return new Date(t).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"}); }

async function loadAll(){
  const [o, s, r] = await Promise.all([
    sb.from("orders").select("*").order("created_at",{ascending:false}),
    sb.from("specimens").select("*").order("created_at",{ascending:false}),
    sb.from("results").select("*").order("created_at",{ascending:false}),
  ]);
  cache.orders = o.data || []; cache.specimens = s.data || []; cache.results = r.data || [];
  renderAll();
}

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  TABS.forEach(t=>{
    const b = document.createElement("button");
    b.textContent = t.label;
    b.className = t.id===active ? "active" : "";
    b.onclick = ()=>{ active = t.id; renderAll(); };
    nav.appendChild(b);
  });
}

function renderAll(){
  renderNav();
  const main = document.getElementById("main");
  main.innerHTML = "";
  const sec = document.createElement("section");
  if(active==="orders") sec.innerHTML = ordersView();
  if(active==="specimens") sec.innerHTML = specimensView();
  if(active==="results") sec.innerHTML = resultsView();
  if(active==="worklist") sec.innerHTML = worklistView();
  main.appendChild(sec);
  wireEvents();
}

function ordersView(){
  const rows = cache.orders.map(o=>`
    <tr><td>${o.patient_name}</td><td>${o.age||"-"}/${o.sex||"-"}</td><td>${o.tests}</td><td>${o.physician||"-"}</td>
    <td><span class="tag ${o.status==='accessioned'?'done':'pending'}">${o.status==='accessioned'?'تم أخذ العينة':'بانتظار العينة'}</span></td></tr>`).join("")
    || `<tr><td colspan="5" class="empty">لا يوجد طلبات بعد</td></tr>`;
  return `
  <h2>استقبال مريض جديد</h2>
  <div class="card">
    <div class="row"><div><label>اسم المريض *</label><input id="f_name"></div><div><label>الطبيب المحوّل</label><input id="f_phys"></div></div>
    <div class="row"><div><label>السن</label><input id="f_age" type="number" min="0"></div>
    <div><label>النوع</label><select id="f_sex"><option value="">--</option><option>ذكر</option><option>أنثى</option></select></div></div>
    <label>الفحوصات المطلوبة *</label><input id="f_tests" placeholder="CBC, Fasting Glucose">
    <label>ملاحظات</label><textarea id="f_notes" rows="2"></textarea>
    <button class="btn" id="addOrder">تسجيل الطلب</button>
  </div>
  <h2>الطلبات الحالية</h2>
  <div class="card wrap"><table><thead><tr><th>المريض</th><th>السن/النوع</th><th>الفحوصات</th><th>الطبيب</th><th>الحالة</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function specimensView(){
  const pending = cache.orders.filter(o=>o.status==="pending");
  const opts = pending.map(o=>`<option value="${o.id}">${o.patient_name} — ${o.tests}</option>`).join("") || `<option value="">لا يوجد طلبات بانتظار عينة</option>`;
  const rows = cache.specimens.map(s=>{
    const o = cache.orders.find(x=>x.id===s.order_id) || {};
    return `<tr><td>${s.acc_id}</td><td>${o.patient_name||"-"}</td><td>${s.type}</td><td>${fmt(s.created_at)}</td></tr>`;
  }).join("") || `<tr><td colspan="4" class="empty">لا يوجد عينات مستلمة بعد</td></tr>`;
  return `
  <h2>استلام وتوسيم العينة</h2>
  <div class="card">
    <label>الطلب</label><select id="f_order">${opts}</select>
    <div class="row"><div><label>نوع العينة</label><select id="f_stype"><option>دم</option><option>بول</option><option>براز</option><option>مسحة</option><option>أخرى</option></select></div>
    <div><label>رقم الحاوية (اختياري)</label><input id="f_container"></div></div>
    <button class="btn" id="addSpecimen" ${pending.length? "" : "disabled"}>تسجيل استلام العينة</button>
  </div>
  <h2>سجل العينات</h2>
  <div class="card wrap"><table><thead><tr><th>الأكسشن</th><th>المريض</th><th>النوع</th><th>وقت الاستلام</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function resultsView(){
  const doneIds = new Set(cache.results.map(r=>r.specimen_id));
  const ready = cache.specimens.filter(s=> !doneIds.has(s.id));
  const opts = ready.map(s=>{
    const o = cache.orders.find(x=>x.id===s.order_id)||{};
    return `<option value="${s.id}">${s.acc_id} — ${o.patient_name} (${o.tests})</option>`;
  }).join("") || `<option value="">لا يوجد عينات بانتظار نتيجة</option>`;
  const rows = cache.results.map(r=>{
    const s = cache.specimens.find(x=>x.id===r.specimen_id)||{};
    const o = cache.orders.find(x=>x.id===s.order_id)||{};
    return `<tr><td>${s.acc_id||"-"}</td><td>${o.patient_name||"-"}</td><td>${(r.values||[]).map(v=>v.name+": "+v.value+(v.flag?" ⚑":"")).join(" · ")}</td></tr>`;
  }).join("") || `<tr><td colspan="3" class="empty">لا يوجد نتائج معتمدة بعد</td></tr>`;
  return `
  <h2>إدخال واعتماد النتيجة</h2>
  <div class="card">
    <label>العينة</label><select id="f_specimen">${opts}</select>
    <div id="resultLines"><div class="result-line">
      <input class="rl_name" placeholder="اسم التحليل"><input class="rl_value" placeholder="القيمة">
      <input class="rl_unit" placeholder="الوحدة"><input class="rl_ref" placeholder="المدى الطبيعي (4-10)"></div></div>
    <button class="btn small secondary" id="addLine" type="button">+ إضافة تحليل آخر</button><br>
    <button class="btn" id="addResult" ${ready.length? "" : "disabled"}>اعتماد النتيجة</button>
  </div>
  <h2>سجل النتائج المعتمدة</h2>
  <div class="card wrap"><table><thead><tr><th>الأكسشن</th><th>المريض</th><th>النتائج</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function worklistView(){
  const items = cache.orders.map(o=>{
    const specs = cache.specimens.filter(s=>s.order_id===o.id);
    const res = cache.results.filter(r=> specs.find(s=>s.id===r.specimen_id));
    let stage="بانتظار العينة", cls="pending";
    if(specs.length && !res.length){ stage="بالمعمل — تحليل"; }
    if(res.length){ stage="التقرير جاهز"; cls="done"; }
    return {o, stage, cls, res};
  });
  const rows = items.map(it=>`<tr><td>${it.o.patient_name}</td><td>${it.o.tests}</td><td><span class="tag ${it.cls}">${it.stage}</span></td>
    <td>${it.res.length? `<button class="btn small secondary" data-report="${it.o.id}">عرض التقرير</button>`:"-"}</td></tr>`).join("")
    || `<tr><td colspan="4" class="empty">لا يوجد طلبات</td></tr>`;
  return `<h2>قائمة العمل — كل الحالات</h2>
  <div class="card wrap"><table><thead><tr><th>المريض</th><th>الفحوصات</th><th>المرحلة</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <div id="reportBox"></div>`;
}

function renderReport(orderId){
  const o = cache.orders.find(x=>x.id===orderId);
  const specs = cache.specimens.filter(s=>s.order_id===orderId);
  const res = cache.results.filter(r=> specs.find(s=>s.id===r.specimen_id));
  const box = document.getElementById("reportBox");
  const lines = res.flatMap(r=>r.values||[]).map(v=>`<tr><td>${v.name}</td><td style="${v.flag?'color:var(--red);font-weight:700':''}">${v.value} ${v.flag?"⚑":""}</td><td>${v.unit||"-"}</td><td>${v.ref||"-"}</td></tr>`).join("");
  box.innerHTML = `<h2>تقرير النتيجة — ${o.patient_name}</h2>
  <div class="card"><p class="muted">السن/النوع: ${o.age||"-"}/${o.sex||"-"} — الطبيب: ${o.physician||"-"} — تاريخ الطلب: ${fmt(o.created_at)}</p>
  <div class="wrap"><table><thead><tr><th>التحليل</th><th>القيمة</th><th>الوحدة</th><th>المدى الطبيعي</th></tr></thead><tbody>${lines||'<tr><td colspan="4" class="empty">لا نتائج</td></tr>'}</tbody></table></div>
  <button class="btn" onclick="window.print()">طباعة / حفظ PDF</button></div>`;
  box.scrollIntoView({behavior:"smooth"});
}

function wireEvents(){
  const addOrder = document.getElementById("addOrder");
  if(addOrder) addOrder.onclick = async ()=>{
    const name = document.getElementById("f_name").value.trim();
    const tests = document.getElementById("f_tests").value.trim();
    if(!name || !tests){ alert("برجاء إدخال اسم المريض والفحوصات."); return; }
    const { error } = await sb.from("orders").insert({
      patient_name: name, tests,
      age: document.getElementById("f_age").value,
      sex: document.getElementById("f_sex").value,
      physician: document.getElementById("f_phys").value,
      notes: document.getElementById("f_notes").value,
      status: "pending"
    });
    if(error){ alert("خطأ: " + error.message); return; }
    loadAll();
  };
  const addSpecimen = document.getElementById("addSpecimen");
  if(addSpecimen) addSpecimen.onclick = async ()=>{
    const orderId = document.getElementById("f_order").value;
    if(!orderId) return;
    const accId = "ACC-" + Date.now().toString().slice(-8);
    const { error } = await sb.from("specimens").insert({
      order_id: orderId, acc_id: accId,
      type: document.getElementById("f_stype").value,
      container: document.getElementById("f_container").value
    });
    if(error){ alert("خطأ: " + error.message); return; }
    await sb.from("orders").update({status:"accessioned"}).eq("id", orderId);
    loadAll();
  };
  const addLine = document.getElementById("addLine");
  if(addLine) addLine.onclick = ()=>{
    const wrap = document.getElementById("resultLines");
    const div = document.createElement("div"); div.className="result-line";
    div.innerHTML = `<input class="rl_name" placeholder="اسم التحليل"><input class="rl_value" placeholder="القيمة"><input class="rl_unit" placeholder="الوحدة"><input class="rl_ref" placeholder="المدى الطبيعي">`;
    wrap.appendChild(div);
  };
  const addResult = document.getElementById("addResult");
  if(addResult) addResult.onclick = async ()=>{
    const specimenId = document.getElementById("f_specimen").value;
    if(!specimenId) return;
    const lines = Array.from(document.querySelectorAll(".result-line")).map(l=>{
      const name = l.querySelector(".rl_name").value.trim();
      const value = l.querySelector(".rl_value").value.trim();
      const unit = l.querySelector(".rl_unit").value.trim();
      const ref = l.querySelector(".rl_ref").value.trim();
      let flag = false;
      const m = ref.match(/^(-?\d+(\.\d+)?)\s*-\s*(-?\d+(\.\d+)?)$/);
      if(m && value && !isNaN(parseFloat(value))){
        const val = parseFloat(value), lo = parseFloat(m[1]), hi = parseFloat(m[3]);
        flag = val < lo || val > hi;
      }
      return {name, value, unit, ref, flag};
    }).filter(l=>l.name && l.value);
    if(!lines.length){ alert("أدخل تحليل واحد على الأقل."); return; }
    const { error } = await sb.from("results").insert({ specimen_id: specimenId, values: lines });
    if(error){ alert("خطأ: " + error.message); return; }
    loadAll();
  };
  document.querySelectorAll("[data-report]").forEach(b=> b.onclick = ()=> renderReport(b.getAttribute("data-report")));
}

// ---- Auth ----
async function boot(){
  if(!configured) return;
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ showApp(); } else { showAuth(); }
  sb.auth.onAuthStateChange((_e, s)=>{ if(s) showApp(); else showAuth(); });
}
function showAuth(){
  document.getElementById("authScreen").style.display = "block";
  document.getElementById("nav").style.display = "none";
  document.getElementById("main").innerHTML = "";
  document.getElementById("logoutBtn").style.display = "none";
}
function showApp(){
  document.getElementById("authScreen").style.display = "none";
  document.getElementById("nav").style.display = "flex";
  document.getElementById("logoutBtn").style.display = "inline-block";
  loadAll();
}
function usernameToEmail(u){
  const clean = u.trim().toLowerCase().replace(/[^a-z0-9._-]/g, "");
  return clean + "@rtlab.local";
}
document.getElementById("signInBtn").onclick = async ()=>{
  const username = document.getElementById("au_email").value.trim();
  const password = document.getElementById("au_pass").value;
  if(!username){ document.getElementById("authMsg").textContent = "أدخل اسم المستخدم."; return; }
  const { error } = await sb.auth.signInWithPassword({ email: usernameToEmail(username), password });
  document.getElementById("authMsg").textContent = error ? "اسم المستخدم أو كلمة المرور غلط" : "";
};
document.getElementById("signUpBtn").onclick = async ()=>{
  const username = document.getElementById("au_email").value.trim();
  const password = document.getElementById("au_pass").value;
  if(!username || password.length < 6){ document.getElementById("authMsg").textContent = "أدخل اسم مستخدم وكلمة مرور 6 حروف على الأقل."; return; }
  const { error } = await sb.auth.signUp({ email: usernameToEmail(username), password });
  document.getElementById("authMsg").textContent = error ? error.message : "تم إنشاء الحساب. سجّل دخول الآن.";
};
document.getElementById("logoutBtn").onclick = async ()=>{ await sb.auth.signOut(); };

boot();
</script>
</body>
</html>
